services:
  - type: web
    name: curamed-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r server/requirements.txt && python server/ml/train.py
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
